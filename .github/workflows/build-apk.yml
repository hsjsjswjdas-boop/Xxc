name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java string: ${JAVA_VER_OUTPUT}"

          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to detect Java major version from string: ${JAVA_VER_OUTPUT}" >&2
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, but detected: ${JAVA_MAJOR}" >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found. Skipping generation."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "Error: Expected APK ${TARGET_APK} was not found!" >&2
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "${TARGET_APK}" ]; then
            echo "Error: ${TARGET_APK} exists but is empty (0 bytes)." >&2
            exit 1
          fi

          case "${TARGET_APK}" in
            *.apk) ;;
            *) echo "Error: ${TARGET_APK} does not have the .apk extension." >&2; exit 1 ;;
          esac

          if [ "${TARGET_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Path is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "APK successfully verified at: ${TARGET_APK} (Size: $(stat -c%s "${TARGET_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${TMP_RELEASE_DIR}"

          REPO_NAME=$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_FILENAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${TMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "${DEST_PATH}"

          if [ ! -s "${DEST_PATH}" ]; then
            echo "Error: Prepared release asset is missing or empty at ${DEST_PATH}" >&2
            exit 1
          fi

          echo "Prepared release asset: ${DEST_PATH} (${ASSET_FILENAME})"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Release asset is missing or empty at ${ASSET_PATH}." >&2
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "Error: Release asset does not have .apk extension: ${ASSET_PATH}" >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Target File: ${ASSET_NAME}

          Note: This APK is intended for testing and debugging purposes.
          It is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "=========================================================="
          echo "                  APK BUILD & RELEASE REPORT              "
          echo "=========================================================="

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "${RELEASE_TAG}" || true

            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Directly Downloadable APK Asset: ${ASSET_NAME}"
            echo ""
            echo "The APK is ready for direct download on your phone under the release Assets section."
            echo "The normal GitHub Actions artifact 'app-debug-apk' is also preserved as a backup."

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Page:** [${RELEASE_TAG}](${RELEASE_URL})"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct Download:** Download the \`.apk\` directly onto your phone from the release **Assets** section."
              echo "- **Backup Artifact:** The normal Actions artifact \`app-debug-apk\` is also available for download in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Release publishing step did not complete successfully or was skipped."
            echo "However, the debug APK build was verified and the GitHub Actions artifact 'app-debug-apk' remains available."
            echo "Download the APK from the Artifacts section of this workflow run."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` is available in this run's Artifacts section."
              echo "- **Notice:** Release publishing did not complete, but the built APK was preserved safely in GitHub Actions artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "=========================================================="
